
name: LangGraph CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub Code
        uses: actions/checkout@v7

      - name: Check Python Syntax
        run: python3 -m compileall -q app

      - name: Build Docker Image
        run: docker build -t langgraph-agent:latest .
